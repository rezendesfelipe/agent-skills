# Same as full/, in Azure Landing Zone mode (spoke peered to a hub, central DNS zones, DNS by policy).
version: 1
regions:
  brazilsouth: brs
environments:
  dev: { subscriptionId: 00000000-0000-0000-0000-000000000001 }
  hml: { subscriptionId: 00000000-0000-0000-0000-000000000002 }
  prod: { subscriptionId: 00000000-0000-0000-0000-000000000003 }
instances: [brs-01]
ci: [azure-devops, github-actions]
profile: private-aks-postgres
state:
  subscriptionId: 00000000-0000-0000-0000-0000000000ff
  resourceGroup: rg-tfstate
  storageAccount: sttfstatecorp001
  container: tfstate
landingZone:
  mode: alz
  hubVnetId: /subscriptions/00000000-0000-0000-0000-0000000000aa/resourceGroups/rg-hub/providers/Microsoft.Network/virtualNetworks/vnet-hub
  dnsServers: [10.0.0.4]
  peering: managed
  dnsByPolicy: true
  privateDnsZoneIds:
    acr: /subscriptions/00000000-0000-0000-0000-0000000000aa/resourceGroups/rg-dns/providers/Microsoft.Network/privateDnsZones/privatelink.azurecr.io
    keyVault: /subscriptions/00000000-0000-0000-0000-0000000000aa/resourceGroups/rg-dns/providers/Microsoft.Network/privateDnsZones/privatelink.vaultcore.azure.net
    aks: /subscriptions/00000000-0000-0000-0000-0000000000aa/resourceGroups/rg-dns/providers/Microsoft.Network/privateDnsZones/privatelink.brazilsouth.azmk8s.io
    postgres: /subscriptions/00000000-0000-0000-0000-0000000000aa/resourceGroups/rg-dns/providers/Microsoft.Network/privateDnsZones/platform.postgres.database.azure.com
stacks:
  - { name: vnet-core, type: vnet, owner: core }
  - { name: aks-core, type: aks, owner: core, dependsOn: [vnet-core] }
  - { name: app-orders, type: app, owner: orders, dependsOn: [vnet-core, aks-core] }
gitops:
  tool: argocd
  argocdVersion: v3.6.2
  repoURL: https://github.com/example/platform.git
  apps:
    - { name: orders, stack: app-orders, tag: "1.8.3" }
