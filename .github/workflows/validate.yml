name: validate

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
      - name: Validate skills and marketplace manifest
        run: node scripts/validate-skills.mjs
      - name: Validate OpenSpec specs and changes
        run: npx --yes @fission-ai/openspec@1.7.0 validate --all --strict --no-interactive

  # AEP delivery graph, human gate 1 (docs/aep/delivery-graph.md): a proposal branch `claude/<change>` may
  # change only openspec/changes/<change>/ until gate 1 is recorded. The check is skipped for branches that
  # are not a change folder (for example an implementation branch) and for pull requests that carry a
  # post-gate-1 node label.
  delivery-check:
    if: github.event_name == 'pull_request' && startsWith(github.head_ref, 'claude/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
      - name: Check the scope of a proposal branch
        env:
          HEAD_REF: ${{ github.head_ref }}
          BASE_REF: ${{ github.base_ref }}
          LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
        run: |
          change="${HEAD_REF#claude/}"
          if [ ! -d "openspec/changes/$change" ]; then
            echo "No openspec/changes/$change folder: not a proposal branch, scope check skipped."
            exit 0
          fi
          approved=""
          case ",$LABELS," in
            *,node:apply,*|*,node:test-and-validate,*|*,node:review,*|*,node:pr-and-ci,*|*,node:merge,*) approved="--approved" ;;
          esac
          node scripts/delivery-check.mjs scope "$change" --base "origin/$BASE_REF" $approved

  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Test the agent-skills CLI
        run: npm test

  docs-generator:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 24]
    defaults:
      run:
        working-directory: plugins/docs-generator/skills/docs-generator
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      # GitHub's Ubuntu runners include Google Chrome, which the PDF renderer uses.
      - run: npm ci
      - name: Test the docs-generator engine
        run: npm test

  # Engine tests of the assessment-report skill (194+ tests) and its contract test with docs-generator, on Linux and Windows.
  # No path filter, so the job can be made a required check without blocking pull requests that do not touch the skill.
  # Making it required is a repository setting the maintainer applies (docs/aep/repository-protection.md).
  assessment-report:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [20, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      # The contract test builds a DOCX with docs-generator, which needs its dependencies.
      - name: Install the docs-generator dependencies
        working-directory: plugins/docs-generator/skills/docs-generator
        run: npm ci
      # The variable turns a skipped contract test into a failure; the step also fails when any test was skipped.
      - name: Test the assessment-report engine
        working-directory: plugins/assessment-report/skills/assessment-report
        shell: bash
        env:
          ASSESSMENT_REPORT_REQUIRE_CONTRACT: "1"
        run: |
          npm test 2>&1 | tee test-output.txt
          skipped=$(tr -d '\r' < test-output.txt | grep -Eo '(^|[[:space:]])skipped [0-9]+$' | tail -n 1 | grep -Eo '[0-9]+$' || true)
          echo "Skipped tests: ${skipped:-unknown}"
          test "${skipped:-unknown}" = "0"

  azure-terraform-stacks:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 24]
    defaults:
      run:
        working-directory: plugins/azure-terraform-stacks/skills/azure-terraform-stacks
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm ci
      - name: Test the azure-terraform-stacks engine
        run: npm test

  azure-terraform-stacks-deep:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: plugins/azure-terraform-stacks/skills/azure-terraform-stacks
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.12.2
          terraform_wrapper: false
      # kubectl, shellcheck and xvfb come with GitHub's Ubuntu runners.
      - name: Install actionlint 1.7.7
        run: |
          bash <(curl -sSfL https://raw.githubusercontent.com/rhysd/actionlint/v1.7.7/scripts/download-actionlint.bash) 1.7.7 "$RUNNER_TEMP"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - name: Install draw.io desktop 24.7.17
        run: |
          curl -sSfL -o "$RUNNER_TEMP/drawio.deb" https://github.com/jgraph/drawio-desktop/releases/download/v24.7.17/drawio-amd64-24.7.17.deb
          sudo apt-get update -qq
          sudo apt-get install -y -qq "$RUNNER_TEMP/drawio.deb" xvfb
      - run: npm ci
      - name: Scaffold the fixtures, check --deep and export the diagrams
        run: node test/ci-deep.mjs --require-drawio

