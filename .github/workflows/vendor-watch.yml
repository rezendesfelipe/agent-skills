name: vendor-watch

# Weekly check of the yaml package vendored in the azure-terraform-stacks skill (OpenSpec change vendor-stacks-engine-yaml).
# The copy is outside `npm audit` and Dependabot's reach, so this job does what they would do:
#   1. the vendored files still equal PROVENANCE.json (offline);
#   2. they still equal the tarball that the npm registry serves for that version, byte for byte (nothing from it is run);
#   3. the OSV advisory feed has no advisory for that version, and a newer version is reported as a notice.
# It sends only the package name and the version to registry.npmjs.org and api.osv.dev. Read-only: no write token, no secret.
on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  yaml:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: plugins/azure-terraform-stacks/skills/azure-terraform-stacks
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
      - name: The vendored files equal their record
        run: node scripts/vendor-yaml.mjs verify
      - name: The vendored files equal the published package
        run: node scripts/vendor-yaml.mjs verify --registry
      - name: Known advisories and newer versions
        run: node scripts/vendor-yaml.mjs watch
