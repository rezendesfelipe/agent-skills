name: publish

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  id-token: write # npm provenance and trusted publishing

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          registry-url: https://registry.npmjs.org
      - name: Check that the tag matches package.json
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json version $version" >&2
            exit 1
          fi
      - run: node scripts/validate-skills.mjs
      - run: npm test
      # Trusted publishing (OIDC) needs npm 11.5.1 or later. No token is used:
      # npmjs.com trusts this repository and workflow file instead.
      - name: Update npm
        run: npm install -g npm@^11.5.1 && npm --version
      - name: Publish to npm
        run: npm publish --provenance --access public
